name: CI - Build and Push

on:
  push:
    branches: [main]
    paths-ignore:
      - 'VERSION.txt' # evita loop infinito: o commit que ESSE workflow faz não deve disparar ele de novo

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump version (+0.0.1)
        id: bump
        run: |
          CURRENT=$(cat VERSION.txt)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "$NEW_VERSION" > VERSION.txt
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit nova versão
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION.txt
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}"
          git push

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Se o build falhar aqui, o job inteiro falha — e como o CD depende
      # do CI ter sucesso (próximo arquivo), o deploy simplesmente não roda.
      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/guerreiro-api-negocio:${{ steps.bump.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/guerreiro-api-negocio:latest