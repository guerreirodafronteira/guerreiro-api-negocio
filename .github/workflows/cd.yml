name: CD - Deploy to Fly.io

on:
  workflow_run:
    workflows: ["CI - Build and Push"]
    types: [completed]

jobs:
  deploy:
    # Só roda se o workflow de CI terminou com SUCESSO — é essa linha que
    # garante "se a build falhar, o deploy não pode acontecer".
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Ler versão atual
        id: version
        run: echo "version=$(cat VERSION.txt)" >> "$GITHUB_OUTPUT"

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --image ghcr.io/${{ github.repository_owner }}/guerreiro-api-negocio:${{ steps.version.outputs.version }} -a guerreiro-api-negocio
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}